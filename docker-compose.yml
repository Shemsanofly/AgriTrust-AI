services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shamba
      POSTGRES_PASSWORD: shamba
      POSTGRES_DB: shamba
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shamba"]
      interval: 5s
      retries: 10

  api:
    build: ./services/api
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://shamba:shamba@db:5432/shamba
      PUBLIC_WEB_URL: http://localhost:8080
      CORS_ORIGINS: http://localhost:8080
    depends_on:
      db: { condition: service_healthy }
    ports: ["8000:8000"]

  web:
    build: ./apps/web
    depends_on: [api]
    ports: ["8080:80"]

volumes:
  pgdata:
